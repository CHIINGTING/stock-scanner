# News resolver dictionary (Phase 1) — EXPLICIT mappings only, no fuzzy guessing.
#
# stock_aliases: 別名/簡稱 → 股票代號。多數正式公司名已由 configs/sectors.yaml +
#   stocks.yaml 自動載入，這裡只補「不在那些清單、或口語簡稱」的對應。代號務求正確；
#   寧可留空 unresolved，也不要亂綁（見 SPEC §5）。
# themes: 主題關鍵字 → 族群名稱。族群名稱盡量對齊 configs/sectors.yaml 的 name，
#   如此個股訊號才能與族群訊號連動、偵測 DIVERGENCE。
#
# 這是可編輯的 seed；隨節目常提到的個股/主題自行增補。

