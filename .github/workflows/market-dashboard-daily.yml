name: market-dashboard-daily

# Builds one Market Dashboard snapshot per Taiwan trading day and commits it, so that real
# institutional history (foreign cash, margin, foreign futures) accumulates from today
# forward. Historical replay cannot supply those — the TAIFEX daily feed has no date
# parameter — so the only way to get an InstitutionalPosture series is to collect it live.
#
# SHADOW-ONLY: this workflow does not touch stock scoring, BUY/WATCH/SELL, stage analysis,
# candlestick, or any ranking. It writes data/market/ and nothing else.

on:
#DIS#   schedule:
#DIS#     # GitHub cron is UTC; Taiwan is UTC+8 year-round (no DST), so 13:00 UTC is always
#DIS#     # 21:00 Taipei. Mon–Fri only; the job itself refuses non-trading days (see below).
#DIS#     #
#DIS#     # Why 21:00 Taipei rather than straight after the 13:30 close:
#DIS#     #   * TWSE BFI82U (foreign cash) is converted using the exchange rate TWSE announces at
#DIS#     #     15:30 — its own notes field says so — so it cannot be final before then.
#DIS#     #   * TWSE MI_MARGN (margin) depends on broker reporting and publishes later still.
#DIS#     #   * TAIFEX institutional futures cover the day session that ends 13:45.
#DIS#     #   * The job first refreshes the price cache, which takes ~30 minutes.
#DIS#     # Neither exchange documents an exact publication time on its data pages, so the schedule
#DIS#     # is deliberately conservative rather than tuned: several hours of margin past the latest
#DIS#     # known constraint, while staying on the same calendar day so the snapshot's date label is
#DIS#     # unambiguous. A too-early run degrades safely — it does not fabricate (see below).
#DIS#     - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date to build (YYYY-MM-DD). Empty = today (Taipei)."
        required: false
      skip_guard:
        description: "Build even if the benchmark did not trade that day (debug only)."
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time: two jobs writing the same day's snapshot and racing to commit would
# either conflict or silently drop one of them.
concurrency:
  group: market-dashboard-daily
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 執行內容已停用。下方每一行原封不動，只多了 #DIS# 前綴。
      - name: Disabled
        run: echo "::notice::這個 workflow 已被手動停用；見檔案頂端說明。"
#DIS#       - name: Checkout
#DIS#         uses: actions/checkout@v4

#DIS#       - name: Setup Go
#DIS#         uses: actions/setup-go@v5
#DIS#         with:
#DIS#           go-version: "1.26"

#DIS#       - name: Resolve Taipei trading date
#DIS#         id: d
#DIS#         run: |
#DIS#           if [ -n "${{ github.event.inputs.date }}" ]; then
#DIS#             DATE="${{ github.event.inputs.date }}"
#DIS#           else
#DIS#             DATE="$(TZ=Asia/Taipei date +%F)"
#DIS#           fi
#DIS#           echo "date=$DATE" >> "$GITHUB_OUTPUT"
#DIS#           echo "Building Market Dashboard for $DATE (Taipei now: $(TZ=Asia/Taipei date '+%F %T'))"

#DIS#       # The market pipeline needs the benchmark series and the full breadth universe, both of
#DIS#       # which live in .cache — which is gitignored and therefore absent on a fresh runner.
#DIS#       # The scanner is what populates it. Its own report output is ignored here; this step
#DIS#       # exists purely to warm the cache, and it is also what makes the trading-day guard
#DIS#       # meaningful (the guard asks whether 0050 actually printed a close).
#DIS#       - name: Refresh price cache
#DIS#         run: go run ./cmd/scanner -config configs/config.yaml --all

#DIS#       - name: Build market snapshot
#DIS#         id: snap
#DIS#         run: |
#DIS#           GUARD="-require-trading-day"
#DIS#           if [ "${{ github.event.inputs.skip_guard }}" = "true" ]; then GUARD=""; fi

#DIS#           set -o pipefail
#DIS#           # -warm-benchmark: the step above cannot supply 0050. `scanner --all` builds its
#DIS#           # universe from FetchStockList, which drops every 4-digit code starting with "0"
#DIS#           # as an ETF — and the benchmark IS an ETF. On a fresh runner .cache therefore has
#DIS#           # every ordinary stock and no benchmark, and the trading-day guard fails with
#DIS#           # "0050 not found in .cache" before a snapshot is ever attempted.
#DIS#           go run ./cmd/market-fetch -date "${{ steps.d.outputs.date }}" -warm-benchmark $GUARD | tee snapshot.log

#DIS#           if grep -q "No snapshot written" snapshot.log; then
#DIS#             echo "written=false" >> "$GITHUB_OUTPUT"
#DIS#           else
#DIS#             echo "written=true" >> "$GITHUB_OUTPUT"
#DIS#           fi

#DIS#       # Every scheduled weekday run that is not a trading day ends here, having written
#DIS#       # nothing. That is a normal outcome, not a failure — Taiwan has ~15 market holidays a
#DIS#       # year plus typhoon closures, and none of them should produce a snapshot or a red run.
#DIS#       - name: Not a trading day
#DIS#         if: steps.snap.outputs.written == 'false'
#DIS#         run: |
#DIS#           echo "::notice::${{ steps.d.outputs.date }} is not a Taiwan trading day (or the price cache lagged). No snapshot written."

#DIS#       # Surface a partial day in the run summary. The pipeline's contract is that a dead
#DIS#       # exchange leaves its evidence explicitly missing with reduced confidence — never
#DIS#       # neutral, and never yesterday's value reused as today's — so a partial snapshot is a
#DIS#       # legitimate record. It is worth seeing at a glance, not worth failing over.
#DIS#       - name: Flag missing sources
#DIS#         if: steps.snap.outputs.written == 'true'
#DIS#         run: |
#DIS#           if grep -q "missing_evidence=none" snapshot.log; then
#DIS#             echo "::notice::All sources present."
#DIS#           else
#DIS#             echo "::warning::Partial snapshot — $(grep -o 'missing_evidence=.*' snapshot.log)"
#DIS#           fi
#DIS#           if grep -q "SOURCE_DATE_MISMATCH" snapshot.log; then
#DIS#             echo "::warning::A source returned a different trading date than requested; that source was recorded as unavailable rather than accepted."
#DIS#           fi
#DIS#           {
#DIS#             echo "### Market Dashboard — ${{ steps.d.outputs.date }}"
#DIS#             echo '```'
#DIS#             grep -E "^(requested_date|source=|missing_evidence)" snapshot.log
#DIS#             echo '```'
#DIS#           } >> "$GITHUB_STEP_SUMMARY"

#DIS#       # Persistence: commit the snapshot into the repo, the same mechanism the hourly scanner
#DIS#       # workflow uses for its reports. data/market/ is NOT gitignored, so no force-add is
#DIS#       # needed. A snapshot is ~4 KB, so a year of daily history is about 1 MB — small enough
#DIS#       # that the simplicity is worth more than an artifact store the analysis code would then
#DIS#       # have to learn to read.
#DIS#       # ── Research archives (R13-M5 / M6) ──────────────────────────────────────────
#DIS#       #
#DIS#       # Both commands read candidate.yaml for their universe and issue TWO bulk requests per
#DIS#       # market — the MOPS and ratio datasets each return every listed company in one response
#DIS#       # — so this costs four requests regardless of how many candidates there are.
#DIS#       #
#DIS#       # Gated on the trading-day flag for a reason beyond politeness: the exchanges publish
#DIS#       # nothing new on a closed day, so fetching then would archive a session that is already
#DIS#       # archived and count it twice in the P/E distribution.
#DIS#       #
#DIS#       # Both exit 0 on a per-symbol failure and non-zero only on a broken candidate.yaml, so
#DIS#       # they are called plainly. No `|| true`: a malformed universe file SHOULD stop the run
#DIS#       # rather than quietly produce an empty archive every day.
#DIS#       - name: Archive fundamentals
#DIS#         if: steps.snap.outputs.written == 'true'
#DIS#         run: go run ./cmd/fundamental-fetch -candidates candidate.yaml

#DIS#       # This one must run EVERY trading day, and skipping it when yesterday's file exists
#DIS#       # would defeat its purpose: the exchanges expose no historical P/E endpoint, so the
#DIS#       # daily archive IS the history. Twenty-odd observations are what turn a single ratio
#DIS#       # into a distribution with a median and a percentile.
#DIS#       - name: Archive valuation ratios
#DIS#         if: steps.snap.outputs.written == 'true'
#DIS#         run: go run ./cmd/valuation-fetch -candidates candidate.yaml

#DIS#       # Market-wide, so it reads no candidate list and its cost does not change with the
#DIS#       # universe: four requests, one snapshot. Gated on the trading day like its siblings —
#DIS#       # not because the sources close, but because a snapshot the rest of the pipeline will
#DIS#       # not consume is an archive entry with no reader.
#DIS#       #
#DIS#       # Archived BEFORE the commit step so the day's macro view lands in the same commit as
#DIS#       # the market, fundamental and valuation archives.
#DIS#       - name: Archive macro
#DIS#         if: steps.snap.outputs.written == 'true'
#DIS#         run: go run ./cmd/macro-fetch

#DIS#       - name: Commit snapshot
#DIS#         if: steps.snap.outputs.written == 'true'
#DIS#         run: |
#DIS#           git config user.name "github-actions[bot]"
#DIS#           git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

#DIS#           # The whole directories rather than one dated path: the research archives name
#DIS#           # their folder after the OBSERVATION date, which the runner derives itself and
#DIS#           # which need not equal the Taipei trading date resolved above. Adding the trees
#DIS#           # avoids encoding that relationship in two places.
#DIS#           #
#DIS#           # `git add` never rewrites an existing file, so yesterday's dated folders are
#DIS#           # untouched — which is the point. A P/E history that overwrote itself would be a
#DIS#           # single observation wearing a series' clothes.
#DIS#           git add data/market/market_${{ steps.d.outputs.date }}.json
#DIS#           git add data/fundamental data/valuation data/macro
#DIS#           if git diff --cached --quiet; then
#DIS#             echo "Nothing changed — nothing to commit (re-running a date is idempotent)."
#DIS#             exit 0
#DIS#           fi
#DIS#           git commit -m "chore(market): snapshot ${{ steps.d.outputs.date }} + research archives"

#DIS#           # The hourly scanner workflow may have pushed while this job was running.
#DIS#           for i in 1 2 3; do
#DIS#             git pull --rebase --autostash && git push && exit 0
#DIS#             echo "push attempt $i failed; retrying"
#DIS#             sleep 5
#DIS#           done
#DIS#           exit 1

#DIS#       - name: Run tests
#DIS#         run: go test ./...
